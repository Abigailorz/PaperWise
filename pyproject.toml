[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperwise"
version = "0.4.1"
description = "AI-powered academic paper interpretation and report generation system"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "openai>=1.50.0",
    "pymupdf>=1.24.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12.0",
    "rich>=13.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "numpy>=1.24.0",
    "jinja2>=3.1.0",
    "python-pptx>=0.6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",

]

[project.scripts]
paperwise = "paperwise.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
