<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperWise — AI 学术论文研究助手</title>
<link rel="icon" href="/static/assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css?v=20260901-trace2">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <img class="logo" src="/static/assets/logo.svg" alt="logo">
      <div class="brand">Paper<span>Wise</span></div>
      <span class="ver">v0.4.1</span>
    </div>
    <div class="sidebar-body" id="sessionList">
      <div class="session-item active" data-sid="current" onclick="switchSession('current')">
        <span class="icon">💬</span>
        <div class="meta"><div class="title">当前对话</div><div class="sub">刚刚</div></div>
      </div>
    </div>
    <div class="sidebar-footer">
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="newSession()">
        <span class="material-symbols-outlined">add</span> 新建对话
      </button>
    </div>
  </aside>

  <div class="main">
    <div class="chat-header">
      <span class="dot off" id="connDot"></span>
      <span class="app-title">PaperWise 研究助手</span>
      <span class="paper-label" id="paperLabel"></span>
      <span class="spacer"></span>
      <div class="actions">
        <button class="btn btn-sm" onclick="toggleRecommendPanel()"><span class="material-symbols-outlined">auto_awesome</span>推荐</button>
        <button class="btn btn-sm" onclick="showAgentTrailPanel()"><span class="material-symbols-outlined">route</span>轨迹</button>
        <button class="btn btn-sm" onclick="toggleMemory()"><span class="material-symbols-outlined">psychology</span>记忆</button>
        <button class="btn btn-sm" onclick="toggleEditor()"><span class="material-symbols-outlined">edit_note</span>编辑</button>
        <button class="btn btn-sm" onclick="toggleReport()"><span class="material-symbols-outlined">description</span>报告</button>
        <button class="btn btn-sm btn-primary" onclick="generatePPTX()" title="用 nature-paper2ppt 技能生成学术汇报 PPT"><span class="material-symbols-outlined">slideshow</span>生成 PPT</button>
      </div>
    </div>

    <div class="agent-ribbon" id="agentRibbon" hidden>
      <span class="trace-live" id="ribbonState">运行中</span>
      <div class="ribbon-main">
        <div class="ribbon-line" id="ribbonRoute">等待路由</div>
        <div class="ribbon-line" id="ribbonNode">等待计划</div>
        <div class="ribbon-line thought" id="ribbonThought"></div>
      </div>
      <button class="btn btn-sm" onclick="showAgentTrailPanel()">详情</button>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input">
      <div class="input-box">
        <div class="input-tools">
          <label class="icon-btn" title="上传论文 PDF" for="fileUpload2">
            <span class="material-symbols-outlined">attach_file</span>
          </label>
          <input type="file" id="fileUpload2" accept=".pdf" hidden onchange="handleFile(this)">
        </div>
        <textarea id="msgInput" rows="1" placeholder="输入消息，或上传论文 PDF 开始..."
                  onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
        <button class="btn btn-primary send-btn" onclick="sendMessage()" id="sendBtn">
          <span class="material-symbols-outlined">send</span>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="panel-overlay" id="panelOverlay" onclick="closeOtherPanels(null)"></div>

<div class="panel" id="recommendPanel">
  <div class="panel-head">
    <h3>主动论文推荐</h3>
    <button class="btn btn-sm" onclick="refreshRecommendations()"><span class="material-symbols-outlined">refresh</span> 刷新</button>
    <button class="icon-btn" onclick="hideRecommendPanel()"><span class="material-symbols-outlined">close</span></button>
  </div>
  <div class="panel-body">
    <div id="recoTopics"></div>
    <div id="recommendBody"></div>
  </div>
</div>

<div class="panel" id="agentTrailPanel">
  <div class="panel-head">
    <h3>运行轨迹</h3>
    <span class="trace-live" id="traceLive">待运行</span>
    <button class="icon-btn" onclick="closeAgentTrailPanel()"><span class="material-symbols-outlined">close</span></button>
  </div>
  <div class="panel-body trace-panel-body">
    <div class="trace-summary">
      <div class="trace-metrics" id="traceMetrics"></div>
      <div class="trace-chain" id="traceChain"></div>
      <div class="trace-toolbar">
        <div class="trace-tabs" id="traceTabs">
          <button data-view="key" class="active">关键</button>
          <button data-view="all">全部</button>
        </div>
        <button class="trace-follow" id="traceFollowBtn" onclick="resetTraceFollow()">跟随最新</button>
      </div>
    </div>
    <div class="trace-timeline" id="traceTimeline"></div>
  </div>
</div>

<div class="panel" id="reportPanel">
  <div class="panel-head">
    <h3>报告内容</h3>
    <button class="icon-btn" onclick="toggleReport()"><span class="material-symbols-outlined">close</span></button>
  </div>
  <div class="panel-body" id="reportContent"></div>
</div>

<div class="panel" id="memoryPanel">
  <div class="panel-head">
    <h3>用户记忆</h3>
    <button class="btn btn-sm" onclick="refreshMemory()">刷新</button>
    <button class="icon-btn" onclick="toggleMemory()"><span class="material-symbols-outlined">close</span></button>
  </div>
  <div class="panel-body" id="memoryList"></div>
</div>

<div class="panel" id="editorPanel">
  <div class="panel-head">
    <h3>章节编辑</h3>
    <button class="icon-btn" onclick="toggleEditor()"><span class="material-symbols-outlined">close</span></button>
  </div>
  <div class="panel-body">
    <select id="sectionSelect" onchange="selectSection()"></select>
    <textarea id="sectionText"></textarea>
    <div class="editor-tools">
      <button class="btn" style="flex:1" onclick="saveSection(false)">保存</button>
      <button class="btn btn-primary" style="flex:1" onclick="saveSection(true)">保存并生成 PPT</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="/static/js/app.js?v=20260901-trace2"></script>
</body>
</html>
