<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperWise — AI 学术论文研究助手</title>
<link rel="icon" href="/static/assets/logo.svg">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <img class="logo" src="/static/assets/logo.svg" alt="logo">
      <div class="brand">Paper<span>Wise</span></div>
      <span class="ver">v0.4.1</span>
    </div>
    <div class="sidebar-body" id="sessionList">
      <div class="session-item active" data-sid="current" onclick="switchSession('current')">
        <span class="icon">💬</span>
        <div class="meta"><div class="title">当前对话</div><div class="sub">刚刚</div></div>
      </div>
    </div>
    <div class="sidebar-footer">
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="newSession()">＋ 新建对话</button>
    </div>
  </aside>

  <!-- 主聊天区 -->
  <div class="main">
    <div class="chat-header">
      <span class="dot off" id="connDot"></span>
      <span class="app-title">PaperWise 研究助手</span>
      <span class="paper-label" id="paperLabel"></span>
      <span class="spacer"></span>
      <div class="actions">
        <button class="btn btn-sm" onclick="toggleRecommendPanel()">🔥 推荐</button>
        <button class="btn btn-sm" onclick="toggleMemory()">🧠 记忆</button>
        <button class="btn btn-sm" onclick="toggleEditor()">✏️ 编辑</button>
        <button class="btn btn-sm" onclick="toggleReport()">📝 报告</button>
        <button class="btn btn-sm btn-primary" onclick="generatePPTX()">📊 生成 PPT</button>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input">
      <div class="input-box">
        <div class="input-tools">
          <label class="icon-btn" title="上传论文 PDF" for="fileUpload2">📎</label>
          <input type="file" id="fileUpload2" accept=".pdf" hidden onchange="handleFile(this)">
        </div>
        <textarea id="msgInput" rows="1" placeholder="输入消息，或上传论文 PDF 开始..."
                  onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
        <button class="btn btn-primary" onclick="sendMessage()" id="sendBtn">发送</button>
      </div>
    </div>
  </div>
</div>

<!-- 面板遮罩 -->
<div class="panel-overlay" id="panelOverlay" onclick="closeOtherPanels(null)"></div>

<!-- 推荐面板 -->
<div class="panel" id="recommendPanel">
  <div class="panel-head">
    <h3>🔥 主动论文推荐</h3>
    <button class="icon-btn" onclick="hideRecommendPanel()">✕</button>
  </div>
  <div class="panel-body">
    <div style="margin-bottom:14px;display:flex;gap:8px">
      <input id="researchTopics" placeholder="研究方向（逗号分隔），如：3DGS, Agent"
             style="flex:1;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);outline:none;font-size:12.5px">
      <button class="btn btn-primary btn-sm" onclick="setResearchTopics()">保存</button>
    </div>
    <div id="recommendBody"></div>
  </div>
</div>

<!-- 报告面板 -->
<div class="panel" id="reportPanel">
  <div class="panel-head">
    <h3>📝 报告内容</h3>
    <button class="icon-btn" onclick="toggleReport()">✕</button>
  </div>
  <div class="panel-body" id="reportContent"></div>
</div>

<!-- 记忆面板 -->
<div class="panel" id="memoryPanel">
  <div class="panel-head">
    <h3>🧠 用户记忆</h3>
    <button class="btn btn-sm" onclick="refreshMemory()">刷新</button>
    <button class="icon-btn" onclick="toggleMemory()">✕</button>
  </div>
  <div class="panel-body" id="memoryList"></div>
</div>

<!-- 章节编辑面板 -->
<div class="panel" id="editorPanel">
  <div class="panel-head">
    <h3>✏️ 章节编辑</h3>
    <button class="icon-btn" onclick="toggleEditor()">✕</button>
  </div>
  <div class="panel-body">
    <select id="sectionSelect" onchange="selectSection()"
            style="width:100%;margin-bottom:10px;padding:8px;background:var(--bg-soft);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:13px"></select>
    <textarea id="sectionText" style="width:100%;height:300px;background:var(--bg-soft);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px;font-family:Consolas,monospace;outline:none"></textarea>
    <div class="editor-tools">
      <button class="btn" style="flex:1" onclick="saveSection(false)">保存</button>
      <button class="btn btn-primary" style="flex:1" onclick="saveSection(true)">保存并生成 PPT</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="/static/js/app.js"></script>
</body>
</html>
