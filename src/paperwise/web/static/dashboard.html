<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperWise 评估 Dashboard</title>
<link rel="icon" href="/static/assets/logo.svg">
<link rel="stylesheet" href="/static/css/style.css">
<style>
  body { height: auto; overflow: auto; padding: 32px 5%; }
  .page-head { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .page-head img { width: 44px; height: 44px; border-radius: 12px; }
  .page-head h1 { font-size: 22px; background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .page-head .sub { color: var(--dim); font-size: 13px; margin-top: 3px; }
  .run-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 18px; }
  .run-card h2 { font-size: 15px; color: var(--accent); margin-bottom: 4px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin: 14px 0; }
  .stat { background: var(--bg-soft); border: 1px solid var(--border-soft); border-radius: 10px; padding: 12px; }
  .stat .label { font-size: 12px; color: var(--dim); }
  .stat .value { font-size: 20px; font-weight: 700; margin-top: 4px; }
  .bar-wrap { background: var(--bg); border: 1px solid var(--border-soft); border-radius: 6px; height: 8px; overflow: hidden; margin-top: 8px; }
  .bar { height: 100%; background: var(--gradient); border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border-soft); text-align: left; }
  th { color: var(--dim); font-weight: 500; }
  .empty { color: var(--dim); text-align: center; padding: 60px 0; }
  .empty code { color: var(--accent); }
</style>
</head>
<body>

<div class="page-head">
  <img src="/static/assets/logo.svg" alt="PaperWise">
  <div>
    <h1>📊 评估 Dashboard</h1>
    <div class="sub">Agent 能力测试历史：Pass@k / Pass^k / 成功率 / 幻觉率</div>
  </div>
  <button class="btn" style="margin-left:auto" onclick="load()">刷新</button>
</div>

<div id="content"><div class="empty">加载中...</div></div>

<script>
async function load() {
  try {
    const r = await fetch('/api/eval/results');
    const d = await r.json();
    const runs = d.runs || [];
    const box = document.getElementById('content');
    if (!runs.length) {
      box.innerHTML = '<div class="empty">暂无测试结果。<br>运行 <code>python tests/run_agent_tests.py --k 3</code> 生成第一条基线。</div>';
      return;
    }
    box.innerHTML = runs.map(run => {
      const overall = run.overall || {};
      const pAtK = ((overall.pass_at_k || 0) * 100).toFixed(1);
      const pK = ((overall.pass_consecutive_k || 0) * 100).toFixed(1);
      const success = ((overall.success_rate || 0) * 100).toFixed(1);
      const scenarios = Object.entries(run.pass_at_k || {});
      return `<div class="run-card">
        <h2>${(run.paper_title || run.paper || '测试').slice(0, 60)} · k=${run.k || 1}</h2>
        <div class="sub" style="color:var(--muted);font-size:12px">${run.model} · ${run.paper || ''} · ${run.timestamp || run.file || ''}</div>
        <div class="stat-grid">
          <div class="stat"><div class="label">Pass@${run.k || 1}</div><div class="value" style="color:var(--green)">${pAtK}%</div>
            <div class="bar-wrap"><div class="bar" style="width:${pAtK}%;background:var(--green)"></div></div></div>
          <div class="stat"><div class="label">Pass^${run.k || 1}</div><div class="value" style="color:var(--accent)">${pK}%</div>
            <div class="bar-wrap"><div class="bar" style="width:${pK}%"></div></div></div>
          <div class="stat"><div class="label">单次成功率</div><div class="value" style="color:var(--orange)">${success}%</div>
            <div class="bar-wrap"><div class="bar" style="width:${success}%;background:var(--orange)"></div></div></div>
          <div class="stat"><div class="label">通过 / 总数</div><div class="value">${run.passed}/${run.total_tests}</div></div>
          <div class="stat"><div class="label">平均步数</div><div class="value">${run.avg_steps || '-'}</div></div>
        </div>
        ${scenarios.length ? `<table><tr><th>场景</th><th>Pass@${run.k}</th><th>Pass^${run.k}</th><th>成功率</th><th>运行数</th></tr>
          ${scenarios.map(([name, m]) => `<tr><td>${name}</td><td>${((m.pass_at_k||0)*100).toFixed(0)}%</td><td>${((m.pass_consecutive_k||0)*100).toFixed(0)}%</td><td>${((m.success_rate||0)*100).toFixed(0)}%</td><td>${m.runs||0}</td></tr>`).join('')}
        </table>` : ''}
      </div>`;
    }).join('');
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="empty">加载失败</div>';
  }
}
load();
</script>
</body>
</html>
